# Publishes the browser-only demo to GitHub Pages: https://duartesantos8.github.io/openGym/
#
# Dormant from 2026-08-19 to 2026-09-10 while the GitHub account was suspended; live again since.
# The same build (same command, Vite's base is './') is also served from the project's own site at
# https://opengym.duarte-santos.ch/demo/, so the demo has two addresses with identical content.
#
# Pages serves static files only, so this build has no backend — VITE_DEMO=1 makes the app
# boot straight into guest mode with a seeded example history (see frontend/src/lib/demo.js).
# PT650 never loads the disputed inherited exercise image/GIF catalogue. Approved 3D exercise
# assets are SHA256-locked and mirrored into the Pages artifact before Vite builds the app.
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Mirror verified PT650 3D assets
        run: node scripts/mirror-pt650-3d-assets.mjs
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_DEMO: '1'
      - uses: actions/configure-pages@v6
        with:
          # A fresh fork may not have a Pages site yet. Create/enable it on the first run
          # instead of requiring a manual Settings → Pages step.
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
