# Publishes the public PT650 web app to GitHub Pages.
#
# GitHub Pages serves the static workout shell; connected PT650 services use Supabase Auth
# and the JWT-protected pt650-platform Edge Function. VITE_DEMO=1 is retained as the build-time
# flag for features that still require the legacy same-origin Node server; it no longer means
# that the whole PT650 product is a fake demo or that users bypass account sign-in.
#
# Approved 3D exercise assets are SHA256-locked and mirrored into the Pages artifact before
# Vite builds the app.
name: Deploy PT650 to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Mirror verified PT650 3D assets
        run: node scripts/mirror-pt650-3d-assets.mjs
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_DEMO: '1'
      - uses: actions/configure-pages@v6
        with:
          # A fresh fork may not have a Pages site yet. Create/enable it on the first run
          # instead of requiring a manual Settings → Pages step.
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
